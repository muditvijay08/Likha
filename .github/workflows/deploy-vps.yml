# Deploys every push to main to the VPS (deploy/vps). Off until the repository variable VPS_ENABLED is "true".
# Secrets (set by following deploy/vps/install.sh): VPS_HOST, VPS_SSH_KEY (can only run likha-update), VPS_KNOWN_HOSTS.
name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: vps-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.VPS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run likha-update on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's key for this account runs exactly one command (likha-update), whatever is sent.
          ssh -o StrictHostKeyChecking=yes likha-deploy@"$VPS_HOST" deploy
