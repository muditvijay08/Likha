# Likha behind an existing nginx (install.sh fills the {PLACEHOLDERS} and certbot adds HTTPS).
# Only these three server names are handled here; other sites on this server are untouched.

server {
    listen 80;
    server_name {SITE_DOMAIN};
    client_max_body_size 2m;
    # likha.in/c/<code> -> Cupid link function (sets the referral cookie, then redirects)
    location /c/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;   # looked up per request, so nginx starts even if DNS blips
        set $supabase https://{SUPABASE_HOST};
        rewrite ^/c/(.*)$ /functions/v1/cupid-redirect/$1 break;
        proxy_pass $supabase;
        proxy_set_header Host {SUPABASE_HOST};
        proxy_ssl_server_name on;
    }
    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name {ADMIN_DOMAIN};
    location / {
        proxy_pass http://127.0.0.1:3202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name {KUNDLI_DOMAIN};
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:3203;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
